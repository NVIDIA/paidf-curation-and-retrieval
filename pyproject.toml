[project]
name = "paidf-curation-and-retrieval"
version = "1.1.0"
description = "Physical AI Data Factory — Curation and Retrieval (glue over Curator, Dataset Search, and Data Mining images)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "NVIDIA" }
]
keywords = [
    "paidf",
    "paidf-curation-and-retrieval",
    "data-curation",
    "dataset-search",
    "cvds",
    "cosmos-curator",
    "data-mining",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Range floors (>=) with next-major caps (<) for ABI-sensitive libs.
# Exact resolved versions live in uv.lock — do not pin == here.
# Curator / Dataset Search / Data Mining engines ship their own deps inside
# pulled Docker images — do not redeclare engine-only packages here.
dependencies = [
    "click>=8.1.8,<9", # internal Make glue helpers
    "numpy>=1.26.4,<2", # DivKNN / clustering / analytics vectors
    "pandas>=2.2.3,<3", # parquet I/O and uniqueness frames
    "pyarrow>=18.1.0,<20", # Curator export → Dataset Search parquet
    "requests>=2.33.0,<3", # Dataset Search HTTP + Cosmos-Embed NIM client (CVE-2026-25645)
    "scikit-learn>=1.5.2,<2", # CPU clustering / PCA / t-SNE fallbacks
    "matplotlib>=3.9.4,<4", # distribution plot analytics
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]

# Development dependencies (testing, linting, formatting)
dev = [
    "pre-commit>=4.5.1,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.14.14,<1",
    "mypy>=1.14.1,<2",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.50,<10",
]

# Optional analytics (UMAP plots)
analytics = [
    "umap-learn>=0.5.7,<1",
]

# All optional dependencies
all = [
    "pre-commit>=4.5.1,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.14.14,<1",
    "mypy>=1.14.1,<2",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.50,<10",
    "umap-learn>=0.5.7,<1",
]

[project.scripts]
# Internal helper for Make targets — not the operator-facing UX.
paidf_curation_and_retrieval = "apps.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "adapters", "apps"]

[tool.uv]
managed = true
# CVE floors for transitive / shared deps resolved into uv.lock.
# Packages that only exist inside Curator / TAO / CDS images (jupyter*, mistune,
# aiohttp, tornado, …) are NOT declared here — bump those image tags instead.
constraint-dependencies = [
    "pillow>=12.2.0",  # CVE-2026-42310 / PDF hang family; scan listed 12.1.1
    "pymdown-extensions>=11.0.1",  # CVE-2026-67422 (also covers CVE-2026-46338)
    "urllib3>=2.7.0",  # CVE-2026-44431, CVE-2026-9375, CVE-2026-44432
    "pygments>=2.20.0",  # CVE-2026-4539 (2.19.2 flagged; bump to latest)
]

[tool.uv.sources]
# All dependencies from PyPI (default)

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
lint.ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ISC001", # Added to prevent formatted conflicts with other rules
]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "logs",
    "_archive",
    ".external/cosmos-curator",
    "cds",
    "runs",
    "sqa_evidence",
    "SQA",
    "SQA_v*",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^\\.git/",
    "^\\.mypy_cache/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
    "^\\.venv/",
    "logs/",
    "_archive/",
    "build/",
    # Local upstream CDS checkout is gitignored and image-owned, not PAIDF glue.
    "cds/",
    "^\\.external/cosmos-curator/",
    "^runs/",
    "^sqa_evidence/",
    "^SQA/",
    "^SQA_v[^/]*/",
]

[tool.coverage.run]
source = [
    "packages",
    "adapters",
    "apps",
    "tests",
]
omit = [
    "*/.venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
pythonpath = [".", "scripts"]
# Never collect an optional external cosmos-curator checkout: its tests require
# heavy runtime deps, and they are upstream's responsibility, not ours.
norecursedirs = [".external/cosmos-curator", ".external/cosmos-curator/*"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--basetemp=.pytest_cache",
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament_xmllint",
    "-p", "no:ament_copyright",
    "-p", "no:ament_lint",
    "-p", "no:ament_flake8",
    "-p", "no:launch_ros",
    "-p", "no:ament_pep257",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
# Coverage options (use --cov flag explicitly to enable)
# addopts = [
#     "--verbose",
#     "--cov=tests",
#     "--cov-report=term-missing",
#     "--cov-report=html",
#     "-p", "no:launch_testing",
# ]

# =============================================================================
# NOTES ON SYSTEM / PRODUCT DEPENDENCIES (NOT PIP PACKAGES)
# =============================================================================
# This package is the PAIDF integration layer only. Product containers are
# pulled images and are NOT Python deps of this repo:
#
# Image pins: Makefile (COSMOS_CURATOR_*, DATASET_SEARCH_*, DATA_MINING_*)
#   - Cosmos Curator / Dataset Search / Data Mining
#   - Cosmos-Embed: NIM endpoint for live text/video embeddings
#
# Host requirements for Docker-backed workflows:
#   - Docker + NVIDIA Container Toolkit
#   - Host FFmpeg sidecar for Curator pipelines (see Makefile ffmpeg-install)
#
# Removed from runtime deps (were Curator-host leftovers, unused by glue code):
#   tqdm, ffmpeg-python, opencv-python-headless, Pillow, boto3,
#   openai, pydantic, jupyterlab
# =============================================================================
