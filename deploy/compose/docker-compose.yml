# Minimal Dataset Search stack for integration-layer development.
# Image is PULLED only (make pull-dataset-search) — never built from this repo.
# Milvus/etcd/minio are upstream dependencies for the Dataset Search API.

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  dataset-search:
    image: ${DATASET_SEARCH_IMAGE:-cosmos-dataset-search}:${DATASET_SEARCH_TAG:?Set DATASET_SEARCH_TAG in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GUNICORN_PORT: "8888"
      GUNICORN_WORKERS: "1"
      GUNICORN_TIMEOUT: "600"
      MILVUS_DOCUMENT_STORE_URI: http://milvus:19530
      MILVUS_DB: ${MILVUS_DB:-default}
      VISUAL_SEARCH_LOG_LEVEL: INFO
      COSMOS_EMBED_NIM_URI: ${COSMOS_EMBED_NIM_URI:-http://host.docker.internal:9000}
      CRADIO_NIM_URI: ${CRADIO_NIM_URI:-http://host.docker.internal:8001}
      ALLOWED_PIPELINES: ${ALLOWED_PIPELINES:-cosmos_video_search_milvus}
    ports:
      - "8888:8888"
    depends_on:
      milvus:
        condition: service_healthy
