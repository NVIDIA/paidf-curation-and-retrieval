# =============================================================================
# Smart City Traffic -- Dedup Config (overrides only)
# =============================================================================
# Higher cluster count for large urban traffic datasets.
# See configs/dedup.yaml for the full reference.
# =============================================================================

pipeline: "dedup"

# -- I/O (under DATA_DIR, mounted at /data; input = split output) --
input_embeddings_path: /data/output/split
output_path: /data/output/dedup
model_weights_path: "/config/models"

# -- Clustering --
n_clusters: 8
eps_to_extract: 0.01
